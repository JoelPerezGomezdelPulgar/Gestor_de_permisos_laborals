<div class="main-dashboard-content">
  <header class="fadeInUp">
    <div class="welcome-msg">
      <h1>Dashboard Administratiu</h1>
      <p>Gestió centralitzada de la plataforma.</p>
    </div>

    <div class="user-profile">
      <div class="avatar">A</div>
      <span>Administrador</span>
    </div>
  </header>

  <!-- Stats Overview -->
  <div class="stats-grid fadeInUp" style="animation-delay: 0.1s">
    <div class="stat-card">
      <span class="stat-label">Permisos Pendents</span>
      <span class="stat-value" style="color: #f59e0b">{{ pendingCount }}</span>
      <div class="stat-trend trend-down"><i class="fa fa-clock-o"></i> Requereix atenció</div>
    </div>
    <div class="stat-card">
      <span class="stat-label">Permisos Aprovats</span>
      <span class="stat-value" style="color: #10b981">{{ approvedCount }}</span>
      <div class="stat-trend trend-up"><i class="fa fa-check-circle-o"></i> Gestió correcte</div>
    </div>
    <div class="stat-card">
      <span class="stat-label">Permisos Rebutjats</span>
      <span class="stat-value" style="color: #ef4444">{{ rejectedCount }}</span>
      <div class="stat-trend trend-down">
        <i class="fa fa-times-circle-o"></i> Denegats recentment
      </div>
    </div>
  </div>

  <!-- Recent Users Section -->
  <section class="content-section fadeInUp" style="animation-delay: 0.2s">
    <div class="card chart-card shadow-sm border-0 h-100">
      <div class="card-header chart-card-header border-0 pt-3">
        <h5 class="card-title fw-bold">Distribució de Peticions</h5>
      </div>
      <div class="card-body chart-card-body">
        <div class="chart-canvas-wrapper">
          <canvas id="miGrafico"></canvas>
        </div>
      </div>
    </div>
    <div class="section-header">
      <h2>Gestió d'Usuaris</h2>
      <button class="btn-add" style="margin-top: 10px" (click)="goToUsers()">
        <i class="fa fa-plus"></i> Mostrar més
      </button>
    </div>
  </section>
</div>
